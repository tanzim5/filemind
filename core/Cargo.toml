[package]
name = "filemind-core"
version = "0.1.0"
edition = "2021"
description = "File Mind's fast local core: scanning, classification and (soon) watching, jobs and storage."

[dependencies]
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
