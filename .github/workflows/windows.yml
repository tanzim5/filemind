name: Windows portable build

on:
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push --tags  -> builds and publishes a release
  workflow_dispatch:      # or run it by hand from the Actions tab (download from the run's artifacts)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU PyTorch keeps the download small and works on every PC)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r packaging/requirements-windows.txt

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-dl
          New-Item -ItemType Directory ffbin | Out-Null
          Get-ChildItem ffmpeg-dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffbin

      - name: Build (CPU, works on every PC)
        run: python packaging/build_windows.py --ffmpeg ffbin --variant cpu

      - name: Build (NVIDIA, downloads PyTorch with CUDA on first run)
        run: python packaging/build_windows.py --ffmpeg ffbin --variant nvidia

      - uses: actions/upload-artifact@v4
        with:
          name: FileMind-Windows
          path: dist/*.zip
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileMind-Windows-portable.zip
            dist/FileMind-Windows-NVIDIA.zip
          body: |
            ## Which one?

            | Download | For | First launch downloads |
            |---|---|---|
            | **`FileMind-Windows-portable.zip`** | Any Windows 10/11 PC. Pick this if unsure. | The AI model, ~1.5 GB |
            | **`FileMind-Windows-NVIDIA.zip`** | PCs with an NVIDIA graphics card (GTX 16-series, RTX 20-series or newer). Indexing is many times faster. | GPU support (PyTorch with CUDA, ~2.8 GB) + the AI model, ~1.5 GB |

            Unzip it anywhere and double-click `FileMind.exe`. Nothing to install. After the first launch File Mind works fully offline.
            The NVIDIA version needs an up-to-date NVIDIA driver; without one it still works, just at CPU speed.

            Windows may say "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
            macOS and Linux: [run from source](https://github.com/tanzim5/filemind#run-from-source-macos-linux-windows) with one command.
