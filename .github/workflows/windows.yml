name: Windows portable build

on:
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push --tags  -> builds and publishes a release
  workflow_dispatch:      # or run it by hand from the Actions tab (download from the run's artifacts)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU PyTorch keeps the download small and works on every PC)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pywebview pyinstaller

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-dl
          New-Item -ItemType Directory ffbin | Out-Null
          Get-ChildItem ffmpeg-dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffbin

      - name: Build
        run: python packaging/build_windows.py --ffmpeg ffbin

      - uses: actions/upload-artifact@v4
        with:
          name: FileMind-Windows-portable
          path: dist/FileMind-Windows-portable.zip
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileMind-Windows-portable.zip
          body: |
            **Windows:** download `FileMind-Windows-portable.zip`, unzip it anywhere, and double-click `FileMind.exe`.
            Nothing to install. The first launch downloads the AI model once (about 1.5 GB); after that File Mind works fully offline.
