name: Release builds

on:
  push:
    tags: ["v*"]          # git tag v0.3.0 && git push --tags  -> builds everything and publishes a release
  workflow_dispatch:      # or run it by hand from the Actions tab (download from the run's artifacts)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU PyTorch keeps the download small and works on every PC)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r packaging/requirements-windows.txt

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-dl
          New-Item -ItemType Directory ffbin | Out-Null
          Get-ChildItem ffmpeg-dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffbin

      - name: Build (CPU, works on every PC)
        run: python packaging/build_windows.py --ffmpeg ffbin --variant cpu

      - name: Build (NVIDIA, downloads PyTorch with CUDA on first run)
        run: python packaging/build_windows.py --ffmpeg ffbin --variant nvidia

      - name: Smoke test (CPU build; downloads the model, indexes a photo, a video and a sound)
        run: python packaging/smoke_test.py dist/cpu/FileMind/FileMind.exe --ffmpeg ffbin

      - uses: actions/upload-artifact@v4
        with:
          name: FileMind-Windows
          path: dist/*.zip
          compression-level: 0

  macos:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 transformers==5.19.0 sentence-transformers==6.1.0
          pip install -r requirements.txt pyinstaller

      - name: Get ffmpeg
        run: |
          mkdir ffbin
          for t in ffmpeg ffprobe; do
            curl -fsSL -o $t.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$t.zip"
            unzip -o -q $t.zip -d ffbin
          done
          chmod +x ffbin/ffmpeg ffbin/ffprobe
          ffbin/ffmpeg -version | head -1

      - name: Build
        run: python packaging/build_macos.py --ffmpeg ffbin

      - name: Smoke test (the runner has no GPU, so MLX runs on its CPU here)
        env:
          FILEMIND_MLX_DEVICE: cpu
        run: |
          mkdir smoke && ditto -x -k dist/FileMind-macOS-arm64.zip smoke
          python packaging/smoke_test.py smoke/FileMind.app/Contents/MacOS/FileMind --ffmpeg ffbin --video-frames 2

      - uses: actions/upload-artifact@v4
        with:
          name: FileMind-macOS
          path: dist/FileMind-macOS-arm64.zip
          compression-level: 0

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileMind-Windows-portable.zip
            dist/FileMind-Windows-NVIDIA.zip
            dist/FileMind-macOS-arm64.zip
          body: |
            ## Which one?

            | Download | For | First launch downloads |
            |---|---|---|
            | **`FileMind-Windows-portable.zip`** | Any Windows 10/11 PC. Pick this if unsure. | The AI model, ~1.5 GB |
            | **`FileMind-Windows-NVIDIA.zip`** | PCs with an NVIDIA graphics card (GTX 16-series, RTX 20-series or newer). Indexing is many times faster. | GPU support (PyTorch with CUDA, ~2.8 GB) + the AI model, ~1.5 GB |
            | **`FileMind-macOS-arm64.zip`** | Macs with Apple Silicon (M1 or newer), macOS 14 or newer. Runs the model on the Mac's GPU. | The AI model, ~1.1 GB |

            **Windows:** unzip anywhere and double-click `FileMind.exe`. Nothing to install. Windows may say "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
            The NVIDIA version needs an up-to-date NVIDIA driver; without one it still works, just at CPU speed.

            **Mac:** unzip, drag `FileMind.app` to Applications, and open it. The app isn't notarized by Apple, so the first time macOS will say it can't verify it: open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. (Or run `xattr -dr com.apple.quarantine /Applications/FileMind.app` once.) Your library index and the model live in `~/Library/Application Support/File Mind`.

            After the first launch File Mind works fully offline. Intel Macs and Linux: [run from source](https://github.com/tanzim5/filemind#run-from-source-macos-linux-windows).
