name: Release builds

on:
  push:
    tags: ["v*"]          # git tag v0.6.0 && git push --tags  -> builds and publishes a release
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing v* tag to publish the build as a GitHub Release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install (CPU PyTorch: PyInstaller needs to see it, but it is left out of the build)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r packaging/requirements-windows.txt

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-dl
          New-Item -ItemType Directory ffbin | Out-Null
          Get-ChildItem ffmpeg-dl -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffbin

      - name: Check app behavior
        run: |
          python -m unittest discover -s tests -q
          node --test tests/*.cjs

      - name: Build the engine (one for every PC; picks CPU or NVIDIA PyTorch on first run)
        run: python packaging/build_windows.py --ffmpeg ffbin --no-zip

      - name: Build the native app and put the engine inside it
        shell: pwsh
        run: |
          dotnet publish native/FileMind.WinUI -c Release -r win-x64 -p:Platform=x64 -o dist/app/FileMind
          Copy-Item -Recurse dist/engine/FileMind dist/app/FileMind/engine
          Compress-Archive -Path dist/app/FileMind -DestinationPath dist/FileMind-Windows.zip

      - name: Validate the download
        run: python packaging/validate_build.py windows

      - name: Smoke test (engine on CPU; downloads PyTorch and the model, indexes a photo, a video and a sound)
        run: python packaging/smoke_test.py dist/engine/FileMind/FileMind.exe --ffmpeg ffbin

      - uses: actions/upload-artifact@v4
        with:
          name: FileMind-Windows
          path: dist/FileMind-Windows.zip
          compression-level: 0

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/FileMind-Windows.zip
          body: |
            ## One download for every Windows 10/11 PC: `FileMind-Windows.zip`

            Unzip anywhere and double-click `FileMind.exe`. Windows may say "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.

            On first launch File Mind checks your graphics card and downloads what it needs once:

            | Your PC | Runs on | First launch downloads |
            |---|---|---|
            | NVIDIA card (GTX 16 / RTX 20 series or newer, current driver) | The GPU, many times faster | PyTorch with CUDA (~2.8 GB) + the AI model (~1.5 GB) |
            | AMD, Intel or no dedicated graphics | The CPU | PyTorch for CPU (~0.12 GB) + the AI model (~1.5 GB) |

            You can force CPU or NVIDIA in Settings. After that File Mind works fully offline. Older releases (macOS, separate NVIDIA build) remain available on the Releases page.

            Made by [Tanzim](https://x.com/tanzim31).
